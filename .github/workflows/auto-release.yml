name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get last release tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Get commits since last tag
        id: commits
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s" --no-merges)
          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          if [ -z "$COMMITS" ]; then
            echo "No new commits since last release"
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_commits=true" >> $GITHUB_OUTPUT
          echo "$COMMITS" > commits.txt

      - name: Determine version bump type
        id: bump_type
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          COMMITS=$(cat commits.txt)

          if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|^[a-z]+\!:)"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^feat(\([a-z]+\))?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new_version
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          LAST_VERSION="${LAST_TAG#v}"

          IFS='.' read -r major minor patch <<< "$LAST_VERSION"

          case "$BUMP_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="$major.$minor.$patch"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        if: steps.commits.outputs.has_commits == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          LAST_TAG="${{ steps.last_tag.outputs.tag }}"

          echo "## Exocortex Starter Kit v${NEW_VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Changes since ${LAST_TAG}" >> release_notes.md

          while IFS= read -r line; do
            echo "- ${line}" >> release_notes.md
          done < commits.txt

          echo "" >> release_notes.md
          echo "### Contents" >> release_notes.md

          for dir in exocmd exo ems ims period pn ztlk uj; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -name "*.md" | wc -l | tr -d ' ')
              echo "- \`${dir}/\` — ${COUNT} files" >> release_notes.md
            fi
          done

          echo "" >> release_notes.md
          echo "### Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "Download \`exocortex-starter-kit.zip\` and extract into your Obsidian vault." >> release_notes.md
          echo "" >> release_notes.md
          echo "See [README](https://github.com/kitelev/exocortex-starter-kit#readme) for details." >> release_notes.md

      - name: Create starter kit archive
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          zip -r exocortex-starter-kit.zip \
            ems/ exo/ exocmd/ ims/ period/ pn/ ztlk/ uj/ README.md \
            -x '*.git*'

      - name: Create git tag
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.commits.outputs.has_commits == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: v${{ steps.new_version.outputs.version }} — Exocortex Starter Kit
          files: exocortex-starter-kit.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
